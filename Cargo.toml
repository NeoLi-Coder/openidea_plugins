[package]
name = "neo-editor-tools"
version = "0.1.2"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]
exclude = ["vendor/openidea-plugin"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { path = "vendor/openidea-plugin" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
