name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已有仓库版本标签，例如 v2026.11.24'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Read package metadata
        id: package
        run: |
          $notes = @(
            '本次 Release 包含以下两个插件，分别下载所需的 .oiplugin 文件，在 OpenIDEA 中选择 Install Plugin from Package File… 安装。',
            '',
            '## 安装包'
          )
          # 仓库使用一个 Release 标签；安装包版本分别读取各插件清单。
          foreach ($plugin in @('editor-tools', 'api-tools')) {
            $manifest = Get-Content "plugins/$plugin/plugin.toml" -Raw
            $version = [regex]::Match($manifest, '(?m)^version = "([^"]+)"').Groups[1].Value
            $name = [regex]::Match($manifest, '(?m)^name = "([^"]+)"').Groups[1].Value
            $file = "neo.$plugin-$version.oiplugin"
            "${plugin}_file=release/$file" >> $env:GITHUB_OUTPUT
            $notes += "- ${name} ${version}：${file}；[功能与权限说明](https://github.com/$env:GITHUB_REPOSITORY/tree/$env:RELEASE_TAG/plugins/$plugin)"
          }
          $notes += @('', '使用 API 工具的快速定位接口入口前，请在插件权限中允许 ide.commands；默认快捷键为 Ctrl+Alt+F11，也可在 IDE 中自定义。')
          $notes | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Rust
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-wasip2
          if ($LASTEXITCODE) { throw 'Rust 工具链安装失败' }
          rustup default 1.100.0
          if ($LASTEXITCODE) { throw 'Rust 工具链选择失败' }

      - name: Build both plugins and run existing tests
        run: ./build.ps1 -Plugin all

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OpenIDEA 插件 ${{ env.RELEASE_TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.editor-tools_file }}
            ${{ steps.package.outputs.api-tools_file }}
          fail_on_unmatched_files: true
          make_latest: 'true'
