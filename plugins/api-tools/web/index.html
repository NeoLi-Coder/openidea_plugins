<style>/* WORKBENCH_STYLE */</style>
<header class="workspace-head"><nav aria-label="工作台"><button data-tab="request">请求工具</button><button data-tab="routes">接口树</button></nav><small id="project"></small></header>
<div id="status" role="status" aria-live="polite"></div>
<section id="scheduledInfo" hidden aria-labelledby="scheduledTitle">
  <div class="section-cap"><strong id="scheduledTitle"></strong><button id="dismissScheduled" aria-label="关闭定时任务提示">×</button></div>
  <p id="scheduledNote"></p>
</section>
<section id="request">
  <div class="toolbar"><div class="group"><button data-icon="history" id="historyBtn" title="请求历史"></button><button data-icon="saved_request" id="savedBtn" title="打开收藏"></button><button data-icon="save" id="saveBtn" title="收藏当前请求"></button></div>
    <div class="group"><button id="curlMenuBtn" popovertarget="curlMenu" aria-controls="curlMenu" aria-expanded="false">cURL <span aria-hidden="true">▾</span></button>
      <div id="curlMenu" popover="auto" role="group" aria-label="cURL 操作"><button data-icon="import" id="importBtn" title="导入 cURL" autofocus>导入 cURL</button><button data-icon="copy" id="exportBtn" title="复制 cURL">复制 cURL</button></div>
    </div>
    <div class="group"><button data-icon="locate" id="locateSource" title="定位当前接口源码" disabled></button><button data-icon="class" id="locateTree" title="在接口树中定位当前接口" disabled></button></div>
    <div class="group env-tools"><select id="activeEnv" aria-label="当前环境"></select><button data-icon="environment" id="envBtn" title="管理环境"></button><button data-icon="globalSettings" id="settingsBtn" title="公共请求头"></button></div>
  </div>
  <div id="serviceBar" class="service-bar" hidden><label>项目<select id="serviceProject"></select></label><label>服务<select id="serviceInfo"></select></label></div>
  <section id="sourceChoices" hidden aria-labelledby="sourceTitle"><div class="section-cap"><strong id="sourceTitle"></strong><button id="dismissSources" aria-label="关闭接口选择">×</button></div><div id="sourceList"></div></section>
  <div class="tabs-line"><div id="tabs" role="tablist" aria-label="已打开的请求"></div><button data-icon="add" id="newBtn" title="新建请求"></button></div>
  <div id="editors"></div>
</section>
<section id="routes" hidden><div class="toolbar"><input class="fill" id="filter" placeholder="搜索路径、控制器或方法" aria-label="搜索接口"><select id="verb" aria-label="筛选 HTTP 方法"></select><button data-icon="refresh" id="refresh" title="重新扫描"></button><button data-icon="expandAll" id="expand" title="全部展开"></button><button data-icon="collapseAll" id="collapse" title="全部折叠"></button></div><div id="tree"></div></section>
<template id="editor"><article class="editor">
  <div class="composer"><select data-id="method" aria-label="HTTP 方法"></select><input data-id="url" aria-label="请求地址" placeholder="输入请求地址" spellcheck="false"><button data-id="send" class="primary" title="发送并预览响应">发送</button><button data-id="download" title="发送并保存响应文件">下载</button></div>
  <div class="split"><section class="request-settings"><nav class="sections" aria-label="请求设置"><button data-pane="params">参数</button><button data-pane="auth">认证</button><button data-pane="headers">请求头</button><button data-pane="cookies">Cookies</button><button data-pane="body">正文</button><button data-pane="transfer">传输</button></nav>
    <section data-panel="params"><div data-id="paths" hidden><h3>路径参数</h3><div class="paths" data-id="pathRows"></div></div><h3>查询参数</h3><div data-id="queryPairs"></div></section>
    <section data-panel="headers" hidden><div data-id="headerPairs"></div></section>
    <section data-panel="cookies" hidden><div data-id="cookieRows"></div></section>
    <section data-panel="auth" hidden><label>认证方式<select data-id="auth"><option>无</option><option>Basic</option><option>Bearer</option></select></label><div data-id="basicFields" hidden><label>用户名<input data-id="basicUser" autocomplete="off"></label><label>密码<input data-id="basicPassword" type="password" autocomplete="off"></label></div><label data-id="bearerField" hidden>Bearer Token<input data-id="credential" type="password" placeholder="Token 或 {{token}}" autocomplete="off"></label></section>
    <section data-panel="body" hidden><div class="modes" aria-label="正文类型"><button data-mode="none">none</button><button data-mode="multipart">form-data</button><button data-mode="form">x-www-form-urlencoded</button><button data-mode="raw">raw</button></div>
      <textarea data-id="body" class="code" aria-label="请求正文" placeholder="输入请求正文" spellcheck="false" hidden></textarea><div data-id="formPairs" hidden></div><div data-id="multipart" hidden><div data-id="parts"></div><button data-id="addPart">＋ 添加字段</button></div></section>
    <section data-panel="transfer" hidden><label class="check"><input type="checkbox" data-id="follow"> 跟随重定向</label><label class="check"><input type="checkbox" data-id="compressed"> 接收压缩响应</label><label>超时（秒，0 使用宿主时限）<input data-id="timeout" type="number" min="0"></label><label>保存响应到文件<input data-id="output" placeholder="留空则预览响应"></label></section>
  </section>
  <div class="divider" role="separator" aria-label="调整请求区和响应区高度" aria-orientation="horizontal" tabindex="0"></div>
  <section class="result"><div class="result-head"><nav aria-label="执行结果"><button data-view="result">响应</button><button data-view="console">控制台</button></nav><small data-id="metrics"></small><button data-id="fold" title="折叠请求区">⌃</button></div>
    <div data-id="result" class="result-page"><div class="empty" data-id="empty"><i data-icon="send"></i>发送请求后，在这里查看响应</div>
      <div data-id="received" hidden><div class="result-options"><button data-detail="body">正文</button><button data-detail="head">响应头</button><span class="spacer"></span><button data-id="pretty" title="格式化 JSON">格式化</button><button data-id="wrap" data-icon="softWrap" title="切换自动换行"></button><button data-id="copy" data-icon="copy" title="复制当前响应内容"></button></div><pre data-id="response"></pre></div></div>
    <pre class="result-page log" data-id="console" hidden></pre>
  </section></div>
</article></template>
<dialog id="manager" class="manager" aria-labelledby="managerTitle"><header><strong id="managerTitle"></strong><button id="managerClose" aria-label="关闭窗口">×</button></header>
<section id="saved" hidden><input id="savedFilter" aria-label="搜索收藏" placeholder="搜索收藏"><div id="collection" class="list"></div></section>
<section id="history" hidden><input id="historyFilter" aria-label="搜索历史" placeholder="搜索历史"><div id="runs" class="list"></div></section>
<section id="env" hidden><label class="check env-level"><input id="advancedEnv" type="checkbox"> 高级环境（项目 / 服务）</label><div class="env-layout"><aside><div class="section-cap">环境<button id="newEnv" data-icon="add" title="新建环境"></button><button id="deleteEnv" data-icon="remove" title="删除所选环境"></button></div><div id="envNames"></div></aside><div id="envFields"><label>服务地址<input id="baseUrl" placeholder="http://localhost:8080" spellcheck="false"></label><div id="addressParts"><label>Host<input id="host" placeholder="http://localhost" spellcheck="false"></label><label>Port<input id="port" placeholder="8080"></label><label>ContextPath<input id="contextPath" placeholder="/api"></label></div><div id="servicesBox" hidden><div class="section-cap">项目服务<button id="addService" data-icon="add" title="添加服务"></button></div><div id="serviceRows"></div></div><h3>环境变量</h3><div id="envPairs"></div></div></div></section>
<section id="settings" hidden><div id="globalPairs"></div></section>
<div id="managerError" role="alert"></div><footer id="configActions" hidden><button id="cancelConfig">取消</button><button id="saveConfig" class="primary">保存</button></footer>
</dialog>
<dialog id="favorite" aria-labelledby="favoriteTitle"><h3 id="favoriteTitle">收藏请求</h3><nav class="favorite-tabs"><button id="baseInfo">基本信息</button><button id="reqInfo">请求信息</button></nav><section id="favBase"><label>名称<input id="favoriteName" autocomplete="off"></label><label>文件夹<input id="favoriteFolder" list="folders" placeholder="未分组" autocomplete="off"></label><datalist id="folders"></datalist><label>说明<textarea id="favoriteDesc" rows="2"></textarea></label></section><section id="favRequest" hidden><small id="favoriteContext"></small><div class="favorite-preview" id="favoritePreview"></div></section><footer><button id="cancelFavorite">取消</button><button id="confirmFavorite" class="primary">收藏</button></footer></dialog>
<dialog id="dialog" aria-labelledby="dialogTitle"><label for="shortText" id="dialogTitle"></label><input id="shortText" autocomplete="off"><textarea id="editText" rows="7" spellcheck="false" hidden></textarea><footer><button id="dialogCancel">取消</button><button id="dialogOK" class="primary">确定</button></footer></dialog>
<dialog id="downloadDialog" aria-labelledby="downloadTitle"><strong id="downloadTitle">下载响应文件</strong><label for="downloadPath">保存到</label><div class="download-path"><input id="downloadPath" spellcheck="false"><button id="downloadFolder">选目录…</button></div><small>可以修改文件名。确认后发送请求，已有同名文件会被覆盖。</small><footer><button id="downloadCancel">取消</button><button id="downloadOK" class="primary">确认下载</button></footer></dialog>
<script>/* WORKBENCH */</script>
