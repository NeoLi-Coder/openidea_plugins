id = "neo.api-tools"
name = "Neo API 工具"
version = "0.1.18"
icon = "icons/lightning.svg"
description = "浏览项目接口、构造请求、导入导出 cURL，并通过已授权的 curl 发送请求。"
authors = ["Neo"]
categories = ["tools"]
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-startup-finished", "on-view:workspace", "on-command:*"]

[capabilities]
required = ["project.read", "storage", "clipboard"]
optional = ["process:curl", "ide.commands"]

# OpenIDEA 从声明派生 java.agent 授权，并在启动 JVM 前校验已批准的 JAR。
[[contributes.javaAgents]]
path = "dist/neo-scheduled-agent.jar"

[[contributes.views]]
id = "workspace"
title = "API 工作台"
location = "right"
icon = "icons/lightning.svg"

[[contributes.providers]]
kinds = ["gutter-actions"]
languages = ["java", "kotlin"]

[[contributes.markerIcons]]
id = "endpoint"
icon = "icons/lightning.svg"

[[contributes.commands]]
id = "open-endpoint"
title = "在 API 工作台打开接口"
category = "Neo API 工具"

[[contributes.commands]]
id = "run-scheduled"
title = "立即执行当前定时任务"
category = "Neo API 工具"

[[contributes.commands]]
id = "browse"
title = "搜索项目 API"
category = "Neo API 工具"
when = "projectOpen"

[[contributes.commands]]
id = "locate-endpoint"
title = "快速定位接口源码"
category = "Neo API 工具"
when = "projectOpen"

[[contributes.keymaps]]
command = "locate-endpoint"
key = "Ctrl+Alt+F11"

[[contributes.menus]]
menu = "tools"
command = "locate-endpoint"

[[contributes.menus]]
menu = "tools"
command = "browse"
